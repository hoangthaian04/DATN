server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: EazyHire
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/easytech}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 phút
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app:
  cv-upload-dir: ${APP_UPLOAD_DIR:private-uploads}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  magic-link-ttl-days: ${MAGIC_LINK_TTL_DAYS:30}
  mail-from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@easyhire.local}}

ai:
  max-input-chars: ${AI_MAX_INPUT_CHARS:40000}
  request-timeout-seconds: ${AI_REQUEST_TIMEOUT_SECONDS:30}
  retry-max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
  retry-backoff-millis: ${AI_RETRY_BACKOFF_MILLIS:800}
  encryption-key: ${AI_ENCRYPTION_KEY:}
  matching:
    embedding-model: ${AI_MATCHING_EMBEDDING_MODEL:gemini-embedding-001}
    input-max-chars: ${AI_MATCHING_INPUT_MAX_CHARS:8000}
    batch-size: ${AI_MATCHING_BATCH_SIZE:32}
    poll-interval-ms: ${AI_MATCHING_POLL_INTERVAL_MS:2000}
    lease-seconds: ${AI_MATCHING_LEASE_SECONDS:120}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
