server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: EazyHire
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/easytech}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 phút
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày

app:
  storage:
    logo-directory: ${LOGO_STORAGE_DIR:uploads/company-logos}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@easytech.vn}
    admin-recipient: ${ADMIN_NOTIFICATION_EMAIL:admin@easytech.vn}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:false}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
