spring:
  datasource:
    url: jdbc:h2:mem:eazyhire;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-with-at-least-32-characters

app:
  mail:
    enabled: false
  storage:
    logo-directory: target/test-uploads

google:
  client-id: test-google-client-id
